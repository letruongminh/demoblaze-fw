name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      testType:
        description: Which suite to run
        type: choice
        default: all
        options:
          - all
          - ui
          - api
          - regression
          - performance
          - smoke
      workers:
        description: Parallel workers
        default: '3'

permissions:
  contents: write # required to publish the Allure report to the gh-pages branch

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & report
    runs-on: ubuntu-latest
    env:
      WORKERS: ${{ github.event.inputs.workers || '3' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java (required by Allure)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run tests (${{ github.event.inputs.testType || 'all' }})
        run: |
          TYPE="${{ github.event.inputs.testType || 'all' }}"
          if [ "$TYPE" = "all" ]; then
            npm test
          else
            npm run "test:$TYPE"
          fi

      - name: Restore previous Allure history
        if: ${{ always() }}
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Generate Allure report
        if: ${{ always() }}
        run: |
          if [ -d gh-pages/history ]; then
            mkdir -p allure-results/history
            cp -r gh-pages/history/* allure-results/history/ || true
          fi
          npm run allure:generate

      - name: Upload Allure report artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Playwright HTML report artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 30
          if-no-files-found: ignore

      - name: Publish Allure report to GitHub Pages
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
